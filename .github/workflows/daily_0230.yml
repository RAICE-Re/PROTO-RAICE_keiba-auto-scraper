name: Keiba Scraper 02:30

on:
  schedule:
    # 日本時間の深夜2:30（UTCの前日17:30）に実行
    - cron: '30 17 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - run: pip install -r requirements.txt
      
      # ステップ1で決めたファイル名と一致させる必要があります
      - name: Run 02:30 Scraper
        run: python Proto_raice_base_0230.py
        
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add *.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Add 02:30 Base data" && git push)
