name: Auto Update Race Results

on:
  schedule:
    # 毎週 土・日・月の 20:00 JST (11:00 UTC) に自動実行
    - cron: '0 11 * * 6,0,1'
  workflow_dispatch: # スマホから手動テスト実行するためのボタン

permissions:
  contents: write

jobs:
  update-results:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas requests beautifulsoup4 pytz

      - name: Run result scraper
        run: python update_results.py

      - name: Commit and push updated master_results.csv
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add master_results.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update master_results.csv" && git push)
